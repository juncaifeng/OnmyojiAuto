[package]
name = "onmyojiauto"
version = "2.3.4"
description = "OnmyojiAuto Tauri desktop shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "onmyojiauto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8.5"
rfd = "0.15"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
